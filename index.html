<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заселение в общежитие</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Заселение в общежитие</h2>
        
        <form id="checkForm">
            <div class="field">
                <label for="studentId">ID студента</label>
                <input type="text" id="studentId" placeholder="Например: 3" required>
            </div>

            <div class="field">
                <label for="buildingNum">Номер корпуса</label>
                <input type="text" id="buildingNum" placeholder="Например: 2" required>
            </div>

            <div class="field">
                <label for="roomNum">Номер комнаты</label>
                <input type="text" id="roomNum" placeholder="Например: 102" required>
            </div>

            <button type="submit">Проверить заселение</button>
        </form>

        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
